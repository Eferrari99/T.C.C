<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Taxi-Dog</title>
        <!-- Favicon / Shorticon -->
        <link rel="shortcut icon" href="img/TAXI-DOG.png" type="image/x-icon">
        <!-- Pacote de ícones https://icons.getbootstrap.com/-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
     
     
        <link rel="stylesheet" href="css/estilo.css">
        <link rel="stylesheet" href="css/cadastro_pets.css">
     </head>
<body>
        <div class="menu">
           <img src="img/TAXI-DOG.png" alt="Logo Taxi-Dog" title="Logo Taxi-Dog">

        </div>

        <div class="cadastro">
            <div class="titulo">Cadastro-PET</div>
      
            <fieldset id="caixa_cadastro">
               <input type="text" placeholder="Nome">
              
               <select id="sexo" name="sexo" onchange="this.classList.toggle('selecionado', this.value !== '')">
                <option value="">Sexo: Selecione</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
            </select>
               <input type="text" placeholder="Raça">
               <input type="number" placeholder="Idade">
               <input type="text" placeholder="Comorbidades">
               
               <a href="perfil.html">
                    <button class="btn_confirmar" type="submit">Confirmar</button>
               </a>
            </fieldset>
      
         </div>

        <div id="rodape">
                <img src="img/TAXI-DOG.png" alt="Logo Taxi-Dog" title="Logo Taxi-Dog">
                <a href="contato.html"></i>Entre em contato</a><br>
         </div>

</body>

</html>
