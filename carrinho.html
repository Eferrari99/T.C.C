<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxi-Dog - Carrinho</title>
<link rel="shortcut icon" href="img/TAXI-DOG.png" type="image/x-icon">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/estilo.css">
<link rel="stylesheet" href="css/carrinho.css">
</head>
<body>
<div id="menu">
<img src="img/TAXI-DOG.png" alt="Logo Taxi-Dog" title="Logo Taxi-Dog">
<a href="index.html"><i class="bi bi-house-door-fill"></i> Home</a>
<a href="sobre.html"><i class="bi bi-person-rolodex"></i> Quem Somos</a>
<a href="produtos.html"><i class="bi bi-bag-fill"></i> produtos</a>
<a href="corrida.html"><i class="bi bi-taxi-front"></i> corrida</a>
<a href="carrinho.html"><i class="bi bi-cart4"></i> carrinho <span id="contadorCarrinho"></span></a>
<a href="perfil.html"><i class="bi bi-person-fill"></i> Perfil</a>
</div>
<main class="pagina-carrinho">
<h1 class="titulo-carrinho">Carrinho</h1>
<div class="carrinho-layout">
<section class="lista-carrinho">
<div class="carrinho-cabecalho"><label><input type="checkbox" id="todosProdutos"> Selecionar todos</label><span id="totalItensCabecalho"></span></div>
<div id="itensCarrinho" class="itens-carrinho"></div>
<p id="carrinhoVazio" class="carrinho-vazio" hidden>Seu carrinho está vazio. <a href="produtos.html">Ver produtos</a></p>
</section>
<aside class="resumo-carrinho">
<h2>Resumo da compra</h2>
<div class="resumo-linha"><span>Itens:</span><span id="quantidade-produtos">0</span></div>
<div class="resumo-linha"><span>Subtotal:</span><span id="subtotal">R$ 0,00</span></div>
<div class="resumo-linha"><span>Frete:</span><span id="frete">R$ 0,00</span></div>
<hr>
<div class="resumo-total"><span>Total:</span><span id="total">R$ 0,00</span></div>
<button class="confirmar-compra" id="confirmarCompra">Confirmar compra</button>
<a class="mais-opcoes" href="produtos.html">Continuar comprando</a>
<p id="mensagemCompra" role="status" aria-live="polite" hidden></p>
</aside>
</div>
</main>
<div id="rodape"><img src="img/TAXI-DOG.png" alt="Logo Taxi-Dog" title="Logo Taxi-Dog"><a href="contato.html">Entre em contato</a></div>
<script src="JavaScript/produtos.js"></script>
<script src="JavaScript/carrinho.js"></script>
</body>
</html>
