<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Taxi-Dog</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="img/TAXI-DOG.png" type="image/x-icon">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/estilo.css">

</head>

<body>

    <!-- =========================
         MENU
    ========================= -->


    <div id="menu">

        <img src="img/TAXI-DOG.png" alt="Logo Taxi-Dog" title="Logo Taxi-Dog">

        <a href="index.html">
            <i class="bi bi-house-door-fill"></i>
            Home
        </a>

        <a href="sobre.html">
            <i class="bi bi-person-rolodex"></i>
            Quem Somos
        </a>

        <a href="produtos.html">
            <i class="bi bi-bag-fill"></i>
            produtos
        </a>

        <a href="corrida.html">
            <i class="bi bi-taxi-front"></i>
            corrida
        </a>

        <a href="carrinho.html">
            <i class="bi bi-cart4"></i>
            carrinho
        </a>

        <a href="perfil.html">
            <i class="bi bi-person-fill"></i>
            Perfil
        </a>

    </div>

    <!-- =========================
         BARRA DE PESQUISA 
    ========================= -->

    <div class="container_pesquisa_sos">
        <div id="Barra_de_pesquisa">
            <i class="bi bi-search"></i>
            <input class="Barra_de_pesquisa" type="text" placeholder=" O que seu pet precisa?" autocomplete="off">
        </div> 
        <a href="SOS.html" class="link_sos">
            <button class="botao_sos" type="button">
                <b>S.O.S</b>
            </button>
        </a>
    </div>

    <!-- =========================
         CARROSSEL DO BANNER
    ========================= -->

    <div id="carrossel">

        <div class="imagens">
            <img src="img/10099140-m.jpg">
            <img src="img/images (21).jpg">
            <img src="img/public (2).avif">
        </div>
    </div>


    <!-- =========================
         CARROSSEL DE PRODUTOS
    ========================= -->
    <div id="contato">
        <h1 id="entre_em_contato">Produto</h1>
    </div>

    <div class="produto-carrossel">

        <!-- Seta esquerda -->
        <button class="produto-seta" onclick="mover(-1)">
            
        </button>


        <!-- Área dos produtos -->
        <div class="produto-container">

            <div class="produto-lista" id="produtos" aria-live="polite"></div>

        </div>


        <!-- Seta direita -->

        <button class="produto-seta" onclick="mover(1)">
            ❯
        </button>

    </div>


    <div id="contato2">
        <h1 id="entre_em_contato2">Colaboradores</h1>
    </div>

    <!-- =========================
     PARCERIAS
========================= -->

    <section id="parcerias">

        <div class="logos-parcerias">

            <img src="img/images.png" alt="Parceiro 1">

            <img src="img/petshops-em-ponte-grande-guarulhos.jpg" alt="Parceiro 2">

            <img src="img/images.jpg" alt="Parceiro 3">

            <img src="img/images (1).jpg" alt="Parceiro 4">

            <img src="img/D_NQ_NP_861157-MLA74976784633_032024-F.jpg" alt="Parceiro 5">

            <img src="img/images (29).jpg" alt="Parceiro 6">

        </div>

    </section>


    <!-- =========================
         RODAPÉ
    ========================= -->

    <div id="rodape">

        <img src="img/TAXI-DOG.png" alt="Logo Taxi-Dog" title="Logo Taxi-Dog">

        <a href="contato.html">
            Entre em contato
        </a>

    </div>

    <!-- JavaScript -->
    <script src="JavaScript/etc.js"></script>
    <script src="JavaScript/produtos.js"></script>
    <script src="JavaScript/index-produtos.js"></script>

</body>

</html>
