<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi-Dog | Login</title>
  <link rel="shortcut icon" href="img/TAXI-DOG.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/estilo.css"><link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="menu"><a href="index.html"><img src="img/TAXI-DOG.png" alt="Logo Taxi-Dog" title="Logo Taxi-Dog"></a></div>
  <main class="blocao">
    <div class="login"><h3>Login</h3></div>
    <form id="formLogin" class="form-login">
      <div class="email"><input id="email" name="email" type="email" placeholder="E-mail" autocomplete="email" required></div>
      <div class="senha"><input id="senha" name="password" type="password" placeholder="Senha" autocomplete="current-password" required></div>
      <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>
      <div class="confirmar"><button type="submit">Entrar</button></div>
    </form>
  </main>
  <div class="faca-cadastro"><span>Ainda não possui uma conta?</span> <a href="cadastro.html">Cadastre-se</a></div>
  <div id="rodape"><img src="img/TAXI-DOG.png" alt="Logo Taxi-Dog" title="Logo Taxi-Dog"><a href="contato.html">Entre em contato</a></div>
  <script src="JavaScript/login.js" defer></script>
</body>
</html>
