
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Taxi-Dog | Perfil</title>

    <link rel="shortcut icon" href="img/TAXI-DOG.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/estilo2.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>

<body>

    <nav id="menu">
        <a class="logo-link" href="index.html">
            <img src="img/TAXI-DOG.png" alt="Logo Taxi-Dog" title="Logo Taxi-Dog">
        </a>

        <a href="index.html">
            <i class="bi bi-house-door-fill"></i> Home
        </a>

        <a href="sobre.html">
            <i class="bi bi-person-rolodex"></i> Quem Somos
        </a>

        <a href="produtos.html">
            <i class="bi bi-bag-fill"></i> produtos
        </a>

        <a href="corrida.html">
            <i class="bi bi-taxi-front"></i> corrida
        </a>

        <a href="carrinho.html">
            <i class="bi bi-cart4"></i> carrinho
        </a>

        <a href="perfil.html">
            <i class="bi bi-person-fill"></i> Perfil
        </a>
    </nav>

    <main class="perfil">

        <section class="coluna coluna-usuario">

            <div class="avatar-inicial" id="avatarUsuario" aria-hidden="true">
                U
            </div>

            <div class="foto-perfil-controles">

                <div class="foto-perfil-wrapper">

                    <img
                        id="fotoUsuario"
                        src=""
                        alt="Foto do perfil"
                        hidden
                    >

                    <label
                        for="arquivoFotoUsuario"
                        class="botao-alterar-foto"
                        title="Alterar foto"
                        aria-label="Alterar foto de perfil"
                    >
                        <i class="bi bi-pencil-fill"></i>
                    </label>

                    <input
                        id="arquivoFotoUsuario"
                        type="file"
                        accept="image/jpeg,image/png,image/webp"
                        aria-label="Escolher foto do dispositivo"
                    >

                </div>

                <p
                    id="mensagemFoto"
                    class="mensagem"
                    role="status"
                    aria-live="polite"
                ></p>

            </div>

            <h2>Minha conta</h2>

            <div class="bloco1" id="dadosUsuario">
                <p>Carregando seus dados...</p>
            </div>

            <button class="botao-sair" id="botaoSair" type="button">
                Sair da conta
            </button>

        </section>

        <section class="coluna coluna-pets">

            <h2>Meus pets</h2>

            <div id="listaPets" class="lista-pets">
                <p>Carregando seus pets...</p>
            </div>

            <a
                href="cadastro_pet.html"
                class="botao-adicionar"
                aria-label="Adicionar pet"
                title="Adicionar pet"
            >
                +
            </a>

        </section>

    </main>

    <div id="rodape">
        <img src="img/TAXI-DOG.png" alt="Logo Taxi-Dog" title="Logo Taxi-Dog">

        <a href="contato.html">Entre em contato</a>
    </div>

    <script src="JavaScript/perfil.js" defer></script>

</body>
</html>
